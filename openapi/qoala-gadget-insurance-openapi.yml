  responses:
    200createQuotation:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                description: status of response, it will contain success
                example: success
              message:
                type: string
                description: short message explains about the success response
                example: success to create quotes
              code:
                type: number
                description: http code response
                example: 200
              data:
                type: object
                description: showing data response
                properties:
                  partner_transaction_number:
                    type: string
                    description: The transaction ID serves as a unique identifier for each transaction
                      initiated through the API. Partners are responsible for generating this ID and ensuring
                      its uniqueness across their transactions.
                    example: Tx12345678543213456
                  transaction_number:
                    type: string
                    description: Unique transaction number generated in qoala system
                    example: QS-GADGET-20251004-ABC12
                  product_code:
                    type: string
                    description: Defined by Qoala, plays a pivotal role in the API, providing contextual
                      information about certain aspects of the product. However, as of now, the details
                      for this field will be shared at a later stage when the product is ready for testing.
                    example: G-ADLD-PARTNER-001
                  policies:
                    type: array
                    items:
                      type: object
                      description: policy information contains about its identifier, status and so on.
                      properties:
                        number:
                          type: string
                          description: unique identifier for policy which is autogenerated by qoala system
                          example: G-ADLD-PARTNER-001-20251004-RGJO7
                        status:
                          type: string
                          description: status of policy, we have set of statuses but we can support mapping
                            status from partner if needed.
                          enum:
                          - POLICY_ACTIVE
                          - POLICY_ISSUING
                          - DATA_VERIFICATION_NEEDED
                          example: POLICY_ACTIVE
                        start_protection_at:
                          type: string
                          description: start date time of policy protection period
                          format: date-time
                          example: '2025-10-04T00:00:00+08:00'
                        end_protection_at:
                          type: string
                          description: end date time of policy protection period
                          format: date-time
                          example: '2026-10-04T00:00:00+08:00'
                        premium_amount:
                          type: number
                          description: premium amount of the policy
                          example: 100000
                        documents:
                          type: array
