  /api/v2/policies/documents/activation:
    servers:
    - url: https://api-staging.qoala.app
    - url: https://api.uat.qoala.app
    - url: https://api.qoala.app
    post:
      tags:
      - API Specification
      summary: Activate Policy
      description: API policy activation is needed when the object to be insured needs to be verified. For example, this usually applies to used, second-hand gadgets, but is not needed for new gadgets.  Only policies with a status of non POLICY_ACTIVE can be activated..
      operationId: activationPolicy
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Activation submitted
                  code:
                    type: number
                    example: 200
                  data:
                    type: object
                    properties:
                      policy_number:
                        type: string
                        example: G-ADLD-PARTNER-001-20251004-OM94T
                      status:
                        type: string
                        example: DATA_VERIFICATION_SUBMITTED
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 400
                  message:
                    type: string
                    example: Invalid request payload
                  status:
                    type: string
                    example: failed
                  data:
                    type: object
                    example: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 401
                  message:
                    type: string
                    example: Unauthorized request
                  status:
                    type: string
                    example: failed
                  data:
                    type: object
                    example: null
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 500
                  error_code:
                    type: string
                    example: QES-ERR-001
                  message:
                    type: string
                    example: internal server error
                  status:
                    type: string
                    example: failed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - policy_number
              - status
              properties:
                policy_number:
                  type: string
                  example: SCS30-001-20220418
                  description: policy number generated by qoala
                status:
                  type: string
                  description: status of activation
                  example: DATA_VERIFICATION_SUBMITTED
                  enum:
                  - DATA_VERIFICATION_SUBMITTED
                  - DATA_VERIFICATION_IN_PROCESS
                activated_at:
                  type: string
                  example: 2006-01-02T15:04:05+0700
                  description: Activation date time that passed from partner or 3rd party service. Date time format follow ISO8601
                upload_activation_at:
                  type: string
                  example: 2006-01-02T15:04:05+0700
                  description: Uploaded date time of evidence or activation file for insurance to review. Date time format follow ISO8601
                supporting_documents:
                  type: object
                  description: Data of uploaded activation document using provided presigned url for activation
                  properties:
                    url:
                      type: string
                      example: URL_DOCUMENT
                      description: S3 URL of uploaded activation document
                    key:
                      type: string
                      example: PRIVATE/POLICIES/PARTNER/GADGET/SCREEN_PROTECTION/example.mp4
                      description: S3 URL key path of uploaded activation document
                    type:
                      type: string
                      description: Enum value type of uploaded document
                      example: POLICY_ACTIVATION
                      enum:
                      - POLICY_ACTIVATION
                    filename:
                      type: string
                      example: example.mp4
                      description: File name of uploaded activation document
                insureds:
                  type: array
                  description: Detailed data of the insured gadget
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: GADGET
                        description: The product category type of the insured detailed data
                      details:
                        type: array
                        description: Detail information about the insured
                        items:
                          type: object
                          properties:
                            identity_type:
                              type: string
                              example: IMEI
                              description: Identity type used for the insured
                            identity_number:
                              type: string
                              example: 865769845678
                              description: Identity number used for the insured
                            model:
                              type: string
                              example: Iphone 8
                              description: The model of the insured gadget
                            manufacturer:
                              type: string
                              example: Apple
                              description: The manufacturer of the insured gadget
                            brand:
                              type: string
                              example: Apple
                              description: The brand which produce the insured gadget
                            series:
                              type: string
                              example: Iphone 8
                              description: The product series of the insured gadget
                            sum_insured:
                              type: number
                              example: 1000000
                              description: The amount insured with the gadget
                            device_category:
                              type: string
                              example: SMARTPHONE
                              description: The insured gadget device’s category
                additional_info:
                  type: object
                  description: Standard additional info object json passed from partner or 3rd party services for policy service to capture
                  properties:
                    activation_number:
                      type: string
                      example: 15SS9Nxm1650255314
                      description: Identifier number of activation process returned from partner or 3rd party service
                    external_url:
                      type: string
                      example: https://smartphone-frame-be-dot-qoala-217505.el.r.appspot.com
                      description: Accessible external resource url that policy service will store this url as activation evidence from partner or 3rd party service.  If external url more than one value than separated by semicolon as separator.
                    result:
                      type: string
                      example: 70%
                      description: Value of crack result in this case is smartphone activation i.e 70%
                    imei:
                      type: string
                      example: 1234567
                      description: Value of detected imei during activation process. If imei more than one value than separated by semicolon as separator
