                  status:
                    type: string
                    example: failed
                  message:
                    type: string
                    example: Unauthorized token
                  error_code:
                    type: string
                    example: QC-CLT-KEYA-V1-003
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 500
                  error_code:
                    type: string
                    example: CLAIM-ERR-001
                  message:
                    type: string
