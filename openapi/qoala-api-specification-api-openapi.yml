          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Success update policy status
                  code:
                    type: number
                    example: 200
                  data:
                    type: object
                    properties:
                      policy_number:
                        type: string
                        example: T-TBUS-PARTNER-001-20230828-OM94T
                      status:
                        type: string
                        example: POLICY_CANCELLED
                      reason:
                        type: string
                        example: explain reason why do you cancel this policy
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 400
                  error_code:
                    type: string
                    example: POLCE-ERR-001
                  message:
                    type: string
                    example: invalid request
                  status:
                    type: string
                    example: failed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorizer Access
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 404
                  error_code:
                    type: string
                    example: QEC-ERR-REST-003
