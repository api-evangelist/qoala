aid: qoala
name: Qoala
description: 'Qoala is a Southeast Asian omni-channel insurtech, headquartered in Jakarta and operating across Indonesia,
  Malaysia, Thailand and Vietnam, that distributes personal and embedded insurance through a consumer app, an agent platform
  (Qoala Plus) and a partner/enterprise API. Qoala for Enterprise exposes a partner-facing REST API covering policy issuance
  and claim handling across travel (flight, train, bus, hotel, experience), gadget, goods, vehicle, logistics, health,
  credit and credit-life product lines. Policy creation is asynchronous: partners POST a quotation, receive a quotation
  number as acknowledgement, and are notified of the issued policy through a partner callback webhook. Authentication
  is by partner API key in the x-api-key header.'
