note: Qoala's MCP server is a DOCUMENTATION-PLANE server, not a capability-plane one. Its six tools are spec-navigation
  and generic-execution primitives over the 15 published OpenAPI documents — there is no per-operation tool such
  as create_policy or create_claim. Every REST operation is therefore reachable only indirectly, through the generic
  execute-request tool, and no tool binds 1:1 to an operationId. This is recorded honestly rather than mapped as
  if per-operation tools existed.
