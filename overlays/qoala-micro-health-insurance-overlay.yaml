overlay: 1.0.0
info:
  title: API Evangelist enhancements for Qoala Micro health insurance
  version: 1.0.0
extends: openapi/qoala-micro-health-insurance-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-provider: qoala
    x-apievangelist-harvest:
      method: mcp
      source: 'https://docs.qoala.app/mcp (tools: list-specs, list-endpoints, get-endpoint)'
      harvested: '2026-08-05'
      note: Reassembled operation-by-operation from the provider-published specification exposed by Qoala's own documentation
        MCP server. Content is verbatim per operation; only the document envelope was rebuilt.
    x-apievangelist-artifacts:
      authentication: authentication/qoala-authentication.yml
      conventions: conventions/qoala-conventions.yml
      errors: errors/qoala-problem-types.yml
      webhooks: asyncapi/qoala-webhooks.yml
      lifecycle: lifecycle/qoala-lifecycle.yml
- target: $
  update:
    x-apievangelist-operation-count: 3
- target: $.paths
  update:
    x-apievangelist-missing-operation-ids:
      count: 1
      operations:
      - POST /api/v2/quotation/quotes
      note: These operations are published without an operationId. API Evangelist did NOT invent ids for them; they are
        recorded here so the gap is visible and can be raised with Qoala.
